<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#171717;--muted:#737373;--line:#e6e6e2;--accent:#176b51}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh}.page{display:none;padding-bottom:88px}.page.active{display:block}#mapPage.active{display:flex;flex-direction:column;position:fixed;inset:0 0 calc(68px + env(safe-area-inset-bottom)) 0;padding:0;overflow:hidden;background:var(--bg)}#mapPage .top{flex:0 0 auto}#mapPage .mapwrap{flex:1;min-height:0;margin-bottom:10px}#mapPage #map{height:100%;min-height:0}
.top{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.muted,.meta{font-size:13px;color:var(--muted)}
.pill{border:0;background:#fff;border-radius:999px;padding:10px 14px;font-weight:650;box-shadow:0 1px 8px #0001}
.mapwrap{position:relative;margin:0 12px}#map{height:100%;min-height:0;border-radius:24px;overflow:hidden;background:#ddd}
.crosshair{position:absolute;z-index:700;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);pointer-events:none}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:#111;box-shadow:0 0 0 2px #fff8}.crosshair:before{width:2px;height:38px;left:18px}.crosshair:after{height:2px;width:38px;top:18px}.crosshair i{position:absolute;width:9px;height:9px;border:2px solid #111;background:#fff;border-radius:50%;left:14.5px;top:14.5px}
.maptools{position:absolute;z-index:800;right:12px;top:12px}.maptools button{border:0;background:#fffffff0;border-radius:13px;padding:10px 12px;font-weight:700;box-shadow:0 1px 8px #0002;backdrop-filter:blur(12px)}
.nearby{position:absolute;z-index:800;left:12px;right:12px;bottom:16px;background:#fffffff2;border-radius:18px;padding:12px 14px;box-shadow:0 4px 20px #0002;backdrop-filter:blur(14px)}.nearby b{display:block;font-size:16px}.nearby small{color:var(--muted)}
.placesHead{padding:calc(16px + env(safe-area-inset-top)) 16px 5px}.placesHead h1{margin:0;font-size:30px}.search{width:100%;margin-top:14px;border:0;background:#e9e9e6;border-radius:14px;padding:12px 14px;font-size:16px}
.filters{display:flex;gap:8px;overflow:auto;padding:8px 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px}.chip.on{background:#171717;color:#fff;border-color:#171717}
.cards{display:grid;gap:10px;padding:8px 16px}.place{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:9px}.thumb{width:74px;height:74px;border-radius:13px;background:#ecece8;object-fit:cover;display:grid;place-items:center;font-size:28px}.place h3{margin:0 0 4px;font-size:16px}.stars{font-size:14px;margin-top:5px;color:#e9a51a}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--muted);text-align:center}
.nav{position:fixed;z-index:1000;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:calc(68px + env(safe-area-inset-bottom));padding:7px 14px env(safe-area-inset-bottom);background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr 1fr}.nav button{border:0;background:none;font-size:12px;font-weight:650;color:#777}.nav button.sel{color:#111}.nav .add{width:50px;height:50px;border-radius:50%;background:#171717;color:#fff;font-size:28px;margin:auto}
.sheet{position:fixed;z-index:2000;inset:0;background:#0005;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{width:min(720px,100%);margin:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.handle{width:42px;height:5px;border-radius:5px;background:#ccc;margin:0 auto 14px}.row{display:flex;gap:10px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-size:16px}.field textarea{min-height:78px;resize:vertical}.primary{width:100%;border:0;border-radius:15px;background:var(--accent);color:#fff;padding:14px;font-weight:750;font-size:16px}.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px}.moreWrap{position:relative}.moreBtn{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-weight:800}.moreMenu{display:none;position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 25px #0002;padding:6px;width:190px;z-index:20}.moreMenu.open{display:block}.moreMenu button{width:100%;border:0;background:none;text-align:left;padding:11px;font-weight:650}.routeInfo{display:none;background:#eef4f1;color:#176b51;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;margin-top:10px}.coords{font-size:12px;color:var(--muted);margin-top:5px}
.rate{display:flex;gap:7px}.star{position:relative;border:0;background:none;padding:0;font-size:33px;line-height:1;color:#ccc}.star.full{color:#efad20}.star.half:after{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden;color:#efad20}.ratingHelp{font-size:12px;color:var(--muted);margin-top:4px}
.previews{display:flex;gap:8px;overflow:auto;margin-top:9px}.preview{position:relative;flex:0 0 90px}.preview img{width:90px;height:90px;object-fit:cover;border-radius:12px}.preview button{position:absolute;right:3px;top:3px;width:25px;height:25px;border:0;border-radius:50%;background:#000b;color:#fff}
.sortrow{display:flex;gap:8px;padding:0 16px 8px}.sortrow select{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px}
.galleryPage{position:fixed;z-index:1500;inset:0;background:var(--bg);display:none;overflow:auto;padding-bottom:30px}.galleryPage.open{display:block}.galleryTop{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#f7f7f5ee;backdrop-filter:blur(15px)}.galleryTop button{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:22px}.galleryTitle{font-weight:800;font-size:20px;flex:1}.editPlace{width:auto!important;border-radius:999px!important;padding:0 14px!important;font-size:14px!important;font-weight:750}.lightbox{position:fixed;z-index:3000;inset:0;background:#000;display:none;flex-direction:column}.lightbox.open{display:flex}.lightboxTop{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:space-between;color:#fff}.lightboxTop button{border:0;background:#ffffff22;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px}.lightboxTrack{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.lightboxSlide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}.lightboxSlide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.lightboxCount{font-size:14px;font-weight:650}.heroGallery{display:flex;overflow:auto;scroll-snap-type:x mandatory;gap:8px;padding:0 14px}.heroGallery img{width:88vw;max-width:620px;height:52vh;min-height:330px;object-fit:cover;border-radius:22px;flex:none;scroll-snap-align:center;background:#ddd}.detail{padding:18px}.detail h1{margin:0 0 4px;font-size:30px}.detailBlock{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.detailRating{font-size:22px;color:#e9a51a}.photoCount{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head><body>
<div class="app">
<section id="mapPage" class="page active">
<header class="top"><div><div class="brand">Pinpoint</div><div class="muted">Move the map beneath the crosshair</div></div><button class="pill" id="count">0 places</button></header>
<div class="mapwrap"><div id="map"></div><div class="crosshair"><i></i></div><div class="maptools"><button id="styleBtn">◫ Explore</button></div><div class="nearby" id="nearby"><b>Finding this place…</b><small>Move the map to choose a location</small></div></div>
</section>
<section id="placesPage" class="page">
<div class="placesHead"><h1>Places</h1><div class="muted" id="placeCount">0 saved places</div><input class="search" id="search" placeholder="Search your places"></div>
<div class="filters" id="filters"></div><div class="sortrow"><select id="ratingFilter"><option value="0">Any rating</option><option value="4">4★ and above</option><option value="3">3★ and above</option><option value="2">2★ and above</option><option value="1">1★ and above</option></select><select id="sort"><option value="new">Newest</option><option value="high">Rating: high to low</option><option value="low">Rating: low to high</option><option value="name">Name A–Z</option></select></div><div class="cards" id="places"></div>
</section></div>
<div class="galleryPage" id="galleryPage"><div class="galleryTop"><button id="galleryBack">‹</button><div class="galleryTitle">Place</div><button class="editPlace" id="editPlace">Edit</button></div><div id="galleryContent"></div></div><div class="lightbox" id="lightbox"><div class="lightboxTop"><button id="lightboxClose">×</button><div class="lightboxCount" id="lightboxCount"></div><div style="width:42px"></div></div><div class="lightboxTrack" id="lightboxTrack"></div></div>
<nav class="nav"><button id="mapBtn" class="sel">⌖<br>Map</button><button class="add" id="addBtn">+</button><button id="placesBtn">♡<br>Places</button></nav>

<div class="sheet" id="sheet"><div class="panel"><div class="handle"></div><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0" id="sheetTitle">Add place</h2><div style="display:flex;gap:8px"><div class="moreWrap"><button type="button" class="moreBtn" id="moreBtn">•••</button><div class="moreMenu" id="moreMenu"><button type="button" id="gpxBtn">↝ Import GPX route</button></div></div><button class="secondary" id="closeBtn">Cancel</button></div></div>
<input id="gpxFile" type="file"  hidden><form id="form"><div class="routeInfo" id="routeInfo"></div>
<div class="field"><label>Place name</label><input id="name" required maxlength="100" placeholder="Finding nearby name…"><div class="coords" id="coords"></div></div>
<div class="row"><div class="field" style="flex:1"><label>Type</label><select id="category"></select></div><div class="field" style="flex:1"><label>Status</label><select id="status"><option>Visited</option><option>Want to visit</option></select></div></div>
<div class="field"><label>Rating <span id="ratingText">5.0</span></label><div class="rate" id="rate"></div><div class="ratingHelp">Tap a star once for whole, then tap that star again for half.</div></div>
<div class="field"><label>Photos</label><input id="photos" type="file" accept="image/*" multiple><div class="ratingHelp">Choose multiple photos. Large images are automatically compressed.</div><div id="previews" class="previews"></div></div>
<div class="field"><label>Notes</label><textarea id="notes" maxlength="1000" placeholder="What made this place worth remembering?"></textarea></div>
<button class="primary" type="submit">Save place</button></form></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS=[["Beach","🏖️"],["Viewpoint","⛰️"],["Hike","🥾"],["Restaurant","🍴"],["Attraction","🏛️"],["Accommodation","🛏️"],["Other","📍"]].map(([name,emoji])=>({name,emoji}));
let places=JSON.parse(localStorage.getItem("pinpoint-places")||"[]").map(p=>({...p,photos:p.photos||[],rating:Number(p.rating||0)}));
let filter="All",rating=5,draftPhotos=[],nearName="",nearType="",geoTimer,mapStyle="Explore",currentPlaceId=null,editingId=null,currentGalleryURLs=[],draftRoute=null;
const $=id=>document.getElementById(id);
const map=L.map("map",{zoomControl:false,worldCopyJump:true}).setView([25,10],2);L.control.zoom({position:"topleft"}).addTo(map);
const explore=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const satellite=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri"});
const markers=L.layerGroup().addTo(map);const routes=L.layerGroup().addTo(map);
const DBNAME="pinpoint-media",STORE="photos";let dbp=new Promise((resolve,reject)=>{let q=indexedDB.open(DBNAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
async function photoPut(id,blob){let db=await dbp;return new Promise((res,rej)=>{let tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function photoGet(id){let db=await dbp;return new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function photoDelete(id){let db=await dbp;return new Promise((res,rej)=>{let tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function photoURL(id){if(!id)return"";if(String(id).startsWith("data:"))return id;let b=await photoGet(id);return b?URL.createObjectURL(b):""}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function emo(c){return(CATS.find(x=>x.name===c)||CATS.at(-1)).emoji}
function starText(v){let s="";for(let i=1;i<=5;i++)s+=i<=Math.floor(v)?"★":v>=i-.5?"½":"☆";return s}
function page(w){$("mapPage").classList.toggle("active",w==="map");$("placesPage").classList.toggle("active",w==="places");$("mapBtn").classList.toggle("sel",w==="map");$("placesBtn").classList.toggle("sel",w==="places");if(w==="map")setTimeout(()=>map.invalidateSize(),30)}
function save(){localStorage.setItem("pinpoint-places",JSON.stringify(places));render()}
function renderFilters(){$("filters").innerHTML=["All",...CATS.map(c=>c.name),"Visited","Want to visit"].map(x=>'<button class="chip '+(filter===x?"on":"")+'" data-f="'+x+'">'+(CATS.some(c=>c.name===x)?emo(x)+" ":"")+x+"</button>").join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()})}
async function render(){
 renderFilters();markers.clearLayers();routes.clearLayers();$("count").textContent=places.length+" "+(places.length===1?"place":"places");$("placeCount").textContent=places.length+" saved "+(places.length===1?"place":"places");
 places.forEach(p=>{if(p.route&&p.route.points&&p.route.points.length>1){let line=L.polyline(p.route.points.map(q=>[q.lat,q.lng]),{weight:5,opacity:.8}).addTo(routes);line.on("click",()=>openPlace(p.id))}let m=L.marker([p.lat,p.lng]).addTo(markers);m.bindPopup('<button style="border:0;background:none;text-align:left;padding:2px" data-popup="'+p.id+'"><b>'+esc(p.name)+'</b><br>'+emo(p.category)+' '+esc(p.category)+' · '+p.rating.toFixed(1)+' ★<br><small>Tap to open</small></button>');m.on("popupopen",()=>setTimeout(()=>{let b=document.querySelector('[data-popup="'+p.id+'"]');if(b)b.onclick=()=>openPlace(p.id)},0))});
 let q=$("search").value.trim().toLowerCase(),min=+$("ratingFilter").value;
 let shown=places.filter(p=>(filter==="All"||p.category===filter||p.status===filter)&&p.rating>=min&&(!q||[p.name,p.category,p.status,p.notes].join(" ").toLowerCase().includes(q)));
 let sort=$("sort").value;if(sort==="high")shown.sort((a,b)=>b.rating-a.rating);if(sort==="low")shown.sort((a,b)=>a.rating-b.rating);if(sort==="name")shown.sort((a,b)=>a.name.localeCompare(b.name));if(sort==="new")shown.sort((a,b)=>String(b.created).localeCompare(String(a.created)));
 $("places").innerHTML=shown.length?shown.map(p=>'<article class="place" data-id="'+p.id+'"><div class="thumb" id="cover-'+p.id+'">'+emo(p.category)+'</div><div><h3>'+esc(p.name)+'</h3><div class="meta">'+emo(p.category)+" "+esc(p.category)+" · "+esc(p.status)+(p.photos?.length?" · "+p.photos.length+" photo"+(p.photos.length===1?"":"s"):"")+'</div><div class="stars">'+starText(p.rating)+" "+p.rating.toFixed(1)+'</div></div><button class="secondary del" data-del="'+p.id+'">×</button></article>').join(""):'<div class="empty">No places match these filters.</div>';
 for(let p of shown){if(p.photos?.length){let u=await photoURL(p.photos[0]),c=$("cover-"+p.id);if(c&&u)c.outerHTML='<img class="thumb" src="'+u+'">'}}
 document.querySelectorAll("[data-id]").forEach(el=>el.onclick=e=>{if(e.target.closest(".del"))return;openPlace(el.dataset.id)});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this place?")){let p=places.find(x=>x.id===b.dataset.del);for(let id of (p?.photos||[]))if(!String(id).startsWith("data:"))await photoDelete(id);places=places.filter(p=>p.id!==b.dataset.del);save()}})
}
async function openPlace(id){let p=places.find(x=>x.id===id);if(!p)return;currentPlaceId=id;let urls=[];for(let x of(p.photos||[])){let u=await photoURL(x);if(u)urls.push(u)}currentGalleryURLs=urls;$("galleryContent").innerHTML=(urls.length?'<div class="heroGallery">'+urls.map((u,i)=>'<img src="'+u+'" data-full="'+i+'">').join("")+'</div>':'<div class="empty" style="margin:14px">No photos yet.</div>')+'<div class="detail"><h1>'+esc(p.name)+'</h1><div class="meta">'+emo(p.category)+' '+esc(p.category)+' · '+esc(p.status)+'</div><div class="detailBlock"><div class="detailRating">'+starText(p.rating)+' <b>'+p.rating.toFixed(1)+'</b></div></div>'+(p.notes?'<div class="detailBlock"><b>Comments</b><div style="margin-top:8px;white-space:pre-wrap">'+esc(p.notes)+'</div></div>':'')+'</div>';$("galleryPage").classList.add("open");document.querySelectorAll("[data-full]").forEach(x=>x.onclick=()=>openLightbox(+x.dataset.full))}
function openLightbox(start=0){$("lightboxTrack").innerHTML=currentGalleryURLs.map(u=>'<div class="lightboxSlide"><img src="'+u+'"></div>').join("");$("lightbox").classList.add("open");requestAnimationFrame(()=>{$("lightboxTrack").scrollLeft=start*$("lightboxTrack").clientWidth;updateLightboxCount()})}
function updateLightboxCount(){let w=$("lightboxTrack").clientWidth||1,i=Math.round($("lightboxTrack").scrollLeft/w);$("lightboxCount").textContent=currentGalleryURLs.length?(i+1)+" / "+currentGalleryURLs.length:""}
async function beginEdit(){let p=places.find(x=>x.id===currentPlaceId);if(!p)return;editingId=p.id;draftRoute=p.route||null;$("name").value=p.name;$("category").value=p.category;$("status").value=p.status;rating=p.rating;$("notes").value=p.notes||"";draftPhotos=[];renderPreviews();renderRate();$("coords").textContent=p.lat.toFixed(5)+", "+p.lng.toFixed(5);$("sheet").classList.add("open")}
function renderRate(){$("ratingText").textContent=rating.toFixed(1);$("rate").innerHTML=[1,2,3,4,5].map(n=>'<button type="button" class="star '+(rating>=n?"full":rating===n-.5?"half":"")+'" data-r="'+n+'">★</button>').join("");document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{let n=+b.dataset.r;rating=rating===n?n-.5:n;renderRate()})}
function infer(d){let t=((d.type||"")+" "+(d.category||"")+" "+(d.addresstype||"")).toLowerCase();if(t.includes("beach"))return"Beach";if(/restaurant|cafe|food/.test(t))return"Restaurant";if(/hotel|hostel|accommodation/.test(t))return"Accommodation";if(t.includes("viewpoint"))return"Viewpoint";if(/tourism|attraction|museum|historic/.test(t))return"Attraction";return"Other"}
async function lookup(){let c=map.getCenter();$("coords").textContent=c.lat.toFixed(5)+", "+c.lng.toFixed(5);$("nearby").innerHTML="<b>Finding this place…</b><small>"+c.lat.toFixed(4)+", "+c.lng.toFixed(4)+"</small>";try{let r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat="+c.lat+"&lon="+c.lng+"&addressdetails=1",{headers:{"Accept-Language":"en"}}),d=await r.json();nearName=d.name||d.address?.beach||d.address?.attraction||d.address?.restaurant||d.address?.amenity||d.address?.village||d.address?.town||d.address?.city||(d.display_name||"").split(",")[0]||"Unnamed place";nearType=infer(d);$("nearby").innerHTML="<b>"+esc(nearName)+"</b><small>"+esc(nearType)+" · "+esc((d.display_name||"").split(",").slice(1,3).join(","))+"</small>"}catch(e){nearName="";$("nearby").innerHTML="<b>Selected location</b><small>"+c.lat.toFixed(4)+", "+c.lng.toFixed(4)+"</small>"}}
map.on("moveend",()=>{clearTimeout(geoTimer);geoTimer=setTimeout(lookup,700)});
function renderPreviews(){$("previews").innerHTML=draftPhotos.map((p,i)=>'<div class="preview"><img src="'+p.url+'"><button type="button" data-rm="'+i+'">×</button></div>').join("");document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draftPhotos.splice(+b.dataset.rm,1);renderPreviews()})}
async function compress(file){
 if(file.size<=4*1024*1024)return file;
 let src=URL.createObjectURL(file),img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=src});URL.revokeObjectURL(src);
 let max=2200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 let quality=.84,blob=await new Promise(r=>c.toBlob(r,"image/jpeg",quality));while(blob.size>4*1024*1024&&quality>.45){quality-=.08;blob=await new Promise(r=>c.toBlob(r,"image/jpeg",quality))}return blob
}
$("photos").onchange=async e=>{let fs=[...e.target.files];for(let f of fs){try{let blob=await compress(f);draftPhotos.push({blob,url:URL.createObjectURL(blob)})}catch(err){alert("One photo could not be processed.")}}renderPreviews();e.target.value=""};

function haversine(a,b){let R=6371,rad=Math.PI/180,dlat=(b.lat-a.lat)*rad,dlon=(b.lng-a.lng)*rad,x=Math.sin(dlat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function readGPX(text){let doc=new DOMParser().parseFromString(text,"application/xml");if(doc.querySelector("parsererror"))throw new Error("Invalid GPX");let ns=[...doc.querySelectorAll("trkpt")];if(ns.length<2)ns=[...doc.querySelectorAll("rtept")];if(ns.length<2)throw new Error("No track points");let pts=ns.map(n=>({lat:Number(n.getAttribute("lat")),lng:Number(n.getAttribute("lon")),ele:n.querySelector("ele")?Number(n.querySelector("ele").textContent):null}));let distance=0,gain=0;for(let i=1;i<pts.length;i++){distance+=haversine(pts[i-1],pts[i]);if(pts[i].ele!==null&&pts[i-1].ele!==null&&pts[i].ele>pts[i-1].ele)gain+=pts[i].ele-pts[i-1].ele}let nm=doc.querySelector("trk > name, rte > name, metadata > name");return{name:nm?nm.textContent.trim():"Imported route",points:pts,distanceKm:distance,elevationGain:gain}}

$("form").onsubmit=async e=>{e.preventDefault();let ids=[];try{for(let x of draftPhotos){let id="ph-"+Date.now()+"-"+crypto.getRandomValues(new Uint32Array(1))[0];await photoPut(id,x.blob);ids.push(id)}}catch(err){alert("Could not save all photos. Your device may be low on storage.");return}if(editingId){let p=places.find(x=>x.id===editingId);p.name=$("name").value.trim();p.category=$("category").value;p.status=$("status").value;p.rating=rating;p.notes=$("notes").value.trim();p.route=draftRoute||p.route||null;p.photos=[...(p.photos||[]),...ids];save();$("sheet").classList.remove("open");let id=editingId;editingId=null;draftPhotos=[];renderPreviews();await openPlace(id)}else{let c=map.getCenter(),p={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:$("name").value.trim(),category:$("category").value,status:$("status").value,rating,notes:$("notes").value.trim(),lat:c.lat,lng:c.lng,photos:ids,route:draftRoute,created:new Date().toISOString()};places.unshift(p);save();$("sheet").classList.remove("open");draftPhotos=[];renderPreviews()}$("form").reset();rating=5;renderRate()};
